<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vuln Watch - jutarnji pregled</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 24px 40px; background: #12161c; color: #dfe6ee;
         font: 14px/1.45 ui-monospace, Consolas, monospace; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 26px 0 6px; color: #8fb7e0; text-transform: uppercase; letter-spacing: .06em; }
  .meta { color: #7d8896; margin: 0 0 16px; }
  .counters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .counters div { background: #1b222c; border: 1px solid #2b3543; border-radius: 6px; padding: 8px 14px; }
  .counters b { display: block; font-size: 20px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-bottom: 18px; }
  .chart span { flex: 1; background: #33506e; border-radius: 2px 2px 0 0; min-height: 2px; }
  .chart span.today { background: #4f8fd0; }
  .filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: #1b222c;
             border: 1px solid #2b3543; border-radius: 6px; padding: 8px 12px; }
  select, input[type=search] { background: #12161c; color: #dfe6ee; border: 1px solid #38445a; border-radius: 4px; padding: 3px 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #232c38; vertical-align: top; }
  th { color: #7d8896; font-weight: normal; font-size: 12px; }
  .hi { color: #ff8a8a; font-weight: bold; }
  .kev { color: #ffce54; }
  .ok { color: #7bd88f; }
  .dim { color: #7d8896; }
  .empty { color: #7d8896; padding: 18px 0; }
  a { color: #78b6ff; }
  .hint { color: #7d8896; margin-top: 26px; }
</style>
</head>
<body>
<h1>Vuln Watch</h1>
<p class="meta">Dan pregleda: <span id="today"></span> · zadnjih 20 dana · <b>svi podaci u ovoj datoteci su izmišljeni</b></p>

<div class="counters" id="counters"></div>
<div class="chart" id="chart" title="broj prijava po danu"></div>

<div class="filters">
  <label>Grupa <select id="f-group"></select></label>
  <label>Softver <select id="f-soft"></select></label>
  <label><input type="checkbox" id="f-kev"> samo KEV</label>
  <label><input type="checkbox" id="f-hit"> samo pogođena verzija</label>
  <input type="search" id="f-q" placeholder="traži CVE ili softver">
  <span class="dim" id="shown"></span>
</div>

<div id="list"></div>

<p class="hint">
  Podatke mijenjaš u istoj datoteci, u dva bloka na dnu: <b>SOFTWARE</b> (što vrtiš) i <b>VULNS</b> (što je objavljeno).
  Spremi datoteku i osvježi stranicu. Ništa ne ide na internet.
</p>

<script>
/* ===== LOGIKA-POCETAK ===== */
var WINDOW_DAYS = 20;

function parseCsv(text) {
  var lines = text.trim().split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
  if (lines.length < 2) return [];
  var head = lines[0].split(',');
  return lines.slice(1).map(function (l) {
    var cells = l.split(',');
    var row = {};
    head.forEach(function (h, i) { row[h.trim()] = (cells[i] || '').trim(); });
    return row;
  });
}

function versionParts(v) {
  return String(v).split(/[.\-_+]/).map(Number).filter(function (n) { return !isNaN(n); });
}

function compareVersions(a, b) {
  var A = versionParts(a), B = versionParts(b);
  for (var i = 0; i < Math.max(A.length, B.length); i++) {
    var d = (A[i] || 0) - (B[i] || 0);
    if (d !== 0) return d < 0 ? -1 : 1;
  }
  return 0;
}

function isAffected(version, spec) {
  return spec.split(';').every(function (one) {
    var m = one.trim().match(/^(>=|<=|<|>|=)\s*(.+)$/);
    if (!m) return false;
    var r = compareVersions(version, m[2]);
    if (m[1] === '<') return r < 0;
    if (m[1] === '<=') return r <= 0;
    if (m[1] === '>') return r > 0;
    if (m[1] === '>=') return r >= 0;
    return r === 0;
  });
}

function buildEntries(software, vulns, today) {
  var mine = {};
  software.forEach(function (s) {
    (mine[s.softver] = mine[s.softver] || []).push(s);
  });
  var out = [];
  vulns.forEach(function (v) {
    var days = Number(v.dana_ako);
    if (!(days >= 0 && days <= WINDOW_DAYS)) return;
    var hosts = mine[v.softver];
    if (!hosts) return;
    var cvss = Number(v.cvss);
    var hit = hosts.filter(function (h) { return isAffected(h.verzija, v.pogodene_versije); });
    var kev = String(v.kev).toLowerCase() === 'da';
    if (cvss < 9 && !kev && hit.length === 0) return;
    var why = [];
    if (cvss >= 9) why.push('Critical');
    if (kev) why.push('KEV');
    if (hit.length) why.push('pogođena verzija');
    out.push({
      cve: v.cve, softver: v.softver, cvss: cvss, kev: kev, days: days,
      url: v.izvor_url, fixed: v.fiksno_izdanje, spec: v.pogodene_versije,
      grupa: hosts[0].grupa,
      hit: hit.map(function (h) { return h.stroj + ' ' + h.verzija; }),
      installed: hosts.map(function (h) { return h.verzija; }).filter(function (x, i, a) { return a.indexOf(x) === i; }),
      why: why.join(' + '),
      date: new Date(today.getTime() - days * 86400000)
    });
  });
  return out.sort(function (a, b) { return a.days - b.days || b.cvss - a.cvss; });
}

function countersFor(entries) {
  return {
    danas: entries.filter(function (e) { return e.days === 0; }).length,
    tjedan: entries.filter(function (e) { return e.days <= 6; }).length,
    sve: entries.length
  };
}
/* ===== LOGIKA-KRAJ ===== */

var SOFTWARE = parseCsv(document.getElementById('csv-software').textContent);
var VULNS = parseCsv(document.getElementById('csv-vulns').textContent);
var TODAY = new Date(new Date().setHours(0, 0, 0, 0));
var ALL = buildEntries(SOFTWARE, VULNS, TODAY);

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function fillSelect(sel, values, label) {
  sel.innerHTML = '<option value="">' + label + '</option>' + values.map(function (v) {
    return '<option>' + esc(v) + '</option>';
  }).join('');
}

function render() {
  var group = document.getElementById('f-group').value;
  var soft = document.getElementById('f-soft').value;
  var onlyKev = document.getElementById('f-kev').checked;
  var onlyHit = document.getElementById('f-hit').checked;
  var q = document.getElementById('f-q').value.trim().toLowerCase();

  var rows = ALL.filter(function (e) {
    if (group && e.grupa !== group) return false;
    if (soft && e.softver !== soft) return false;
    if (onlyKev && !e.kev) return false;
    if (onlyHit && e.hit.length === 0) return false;
    if (q && (e.cve + ' ' + e.softver).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  var c = countersFor(ALL);
  document.getElementById('counters').innerHTML =
    '<div><b>' + c.danas + '</b>danas</div>' +
    '<div><b>' + c.tjedan + '</b>7 dana</div>' +
    '<div><b>' + c.sve + '</b>20 dana</div>' +
    '<div><b>' + ALL.filter(function (e) { return e.hit.length; }).length + '</b>pogođena verzija</div>' +
    '<div><b>' + ALL.filter(function (e) { return e.kev; }).length + '</b>KEV</div>';

  var max = 0;
  var perDay = [];
  for (var d = WINDOW_DAYS; d >= 0; d--) {
    var n = ALL.filter(function (e) { return e.days === d; }).length;
    max = Math.max(max, n);
    perDay.push({ day: d, n: n });
  }
  document.getElementById('chart').innerHTML = perDay.map(function (p) {
    var h = max ? Math.round(p.n / max * 44) : 2;
    return '<span class="' + (p.day === 0 ? 'today' : '') + '" style="height:' + h + 'px" title="' +
      (p.day === 0 ? 'danas' : 'prije ' + p.day + ' dana') + ': ' + p.n + '"></span>';
  }).join('');

  var byGroup = {};
  rows.forEach(function (e) { (byGroup[e.grupa] = byGroup[e.grupa] || []).push(e); });

  var html = Object.keys(byGroup).sort().map(function (g) {
    var body = byGroup[g].map(function (e) {
      return '<tr><td class="' + (e.cvss >= 9 ? 'hi' : '') + '">' + esc(e.cve) + '</td>' +
        '<td>' + esc(e.softver) + ' <span class="dim">' + esc(e.spec) + '</span></td>' +
        '<td>' + esc(e.installed.join(', ')) + '</td>' +
        '<td class="' + (e.cvss >= 9 ? 'hi' : '') + '">' + e.cvss.toFixed(1) + '</td>' +
        '<td class="' + (e.kev ? 'kev' : 'dim') + '">' + (e.kev ? 'KEV' : '-') + '</td>' +
        '<td class="' + (e.hit.length ? 'hi' : 'ok') + '">' +
          (e.hit.length ? 'DA: ' + esc(e.hit.join(', ')) : 'ne pogođeno') + '</td>' +
        '<td class="ok">' + esc(e.fixed) + '</td>' +
        '<td class="dim">' + e.date.toLocaleDateString('hr-HR') + ' (' + esc(e.why) + ')</td>' +
        '<td><a href="' + esc(e.url) + '">advisory</a></td></tr>';
    }).join('');
    return '<h2>' + esc(g) + ' · ' + byGroup[g].length + '</h2>' +
      '<table><tr><th>CVE</th><th>softver / opseg</th><th>moje verzije</th><th>CVSS</th><th>KEV</th>' +
      '<th>pogođeni stroj</th><th>fiksno u</th><th>kad / zašto</th><th>link</th></tr>' + body + '</table>';
  }).join('');

  document.getElementById('list').innerHTML = html || '<p class="empty">Nema zapisa za ovaj filter.</p>';
  document.getElementById('shown').textContent = 'prikazano ' + rows.length + ' od ' + ALL.length;
}

document.getElementById('today').textContent = TODAY.toLocaleDateString('hr-HR');
fillSelect(document.getElementById('f-group'), SOFTWARE.map(function (s) { return s.grupa; })
  .filter(function (x, i, a) { return a.indexOf(x) === i; }).sort(), 'sve grupe');
fillSelect(document.getElementById('f-soft'), ALL.map(function (e) { return e.softver; })
  .filter(function (x, i, a) { return a.indexOf(x) === i; }).sort(), 'sav softver');
['f-group', 'f-soft', 'f-kev', 'f-hit', 'f-q'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', render);
});
render();
</script>
</body>
</html>
